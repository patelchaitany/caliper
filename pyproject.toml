[project]
name = "caliper"
version = "0.1.0"
description = "A reproducible code review authority. The model detects; code judges."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "anthropic[vertex]>=0.40",
    "google-genai>=1.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
caliper = "caliper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caliper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends() and typer.Argument() in defaults is the documented idiom for both
# frameworks; B008 is a false positive here.
"src/caliper/api.py" = ["B008"]
"src/caliper/cli.py" = ["B008"]
