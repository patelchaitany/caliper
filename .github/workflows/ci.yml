name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI runs untrusted PR code and needs nothing more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1

      # A virtualenv, not --system: the runner's Python is externally managed
      # (PEP 668) and rejects a system install. uv fetches the interpreter.
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test
        run: pytest -q

      # The offline detector means the whole pipeline is exercised in CI with
      # no credentials and no cost.
      - name: Smoke — review
        run: caliper review examples/sample_submission --backend replay --author ci@caliper

      - name: Smoke — reproducibility
        run: caliper verify examples/decent_service --backend replay --runs 3

      - name: Gate — a clean submission must pass its own threshold
        run: caliper review examples/decent_service --backend replay --fail-under 80
